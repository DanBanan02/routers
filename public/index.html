<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="style.css">

    <title>
        User Form
    </title>

</head>


<body>

    <h1 id="createUserTitle">
        Create User
    </h1>


    <form id="userForm">

        <input
            id="username_int"
            type="text"
            placeholder="Username"
            required
        >


        <input
            id="email_int"
            type="email"
            placeholder="Email"
            required
        >


        <input
            id="password_int"
            type="password"
            placeholder="Password"

            required
            minlength="8"
            
        >


        <input
            id="adresse_int"
            type="text"
            placeholder="Adresse"
            required
        >


        <button 
        id="submit_btn"
        type="submit">
            Create User
        </button>

    </form>
    
    <script src="script.js"></script>

</body>

</html>
