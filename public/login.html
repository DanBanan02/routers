<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <title>
        Login
    </title>

</head>


<body>

    <h1 id="login_title">
        Login
    </h1>


    <form id="loginForm">

        <input
            id="login_username"
            type="text"
            placeholder="Username"
            required
        >


        <input
            id="login_password"
            type="password"
            placeholder="Password"
            required
        >


        <button
            id="login_btn"
            type="submit"
        >
            Login
        </button>

    </form>


    <p id="login_message"></p>


    <a href="/register">
        Create a "New account"
    </a>


    <script src="/login.js"></script>

</body>

</html>
